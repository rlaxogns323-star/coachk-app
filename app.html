<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>코치K 기록</title>
<meta name="description" content="COACH K 운동 기록 — 오늘 운동을 기록하고, 쓰는 근육을 그림으로 확인하세요.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B0B0B">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="코치K 기록">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="top">
  <div class="top-in">
    <button class="back" id="backBtn" type="button" data-act="back" hidden aria-label="뒤로">
      <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="brand">COACH K</div>
    <h1 class="top-title" id="topTitle">오늘 운동</h1>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<!-- 휴식 타이머 -->
<div class="rest" id="rest" hidden>
  <span class="rest-label">휴식</span>
  <strong class="rest-time" id="restTime">01:30</strong>
  <button type="button" data-act="rest-add">+30초</button>
  <button type="button" data-act="rest-stop">끝내기</button>
</div>

<nav class="tabbar" aria-label="메뉴">
  <button type="button" class="tab" data-tab="today">
    <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg><span>오늘 운동</span>
  </button>
  <button type="button" class="tab" data-tab="history">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>기록</span>
  </button>
  <button type="button" class="tab" data-tab="progress">
    <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-6"/></svg><span>성장</span>
  </button>
  <button type="button" class="tab" data-tab="more">
    <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>더보기</span>
  </button>
</nav>

<!-- 아래에서 올라오는 창 -->
<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<!-- 확인 창 -->
<div class="dialog-wrap" id="dialogWrap" hidden>
  <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlgTitle">
    <h2 id="dlgTitle"></h2>
    <p id="dlgText"></p>
    <div class="dialog-btns" id="dlgBtns"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="bodymap.js"></script>
<script src="exercises.js"></script>
<script src="app.js"></script>
</body>
</html>
